<div class="chart-plot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" role="group" aria-label="Dot-and-whisker chart: AI share of each domain’s output, uplift estimate with range and measured volume share. Use Tab to step through the domains."><line class="cp-grid" x1="226" y1="28" x2="226" y2="572"></line><line class="cp-grid" x1="345" y1="28" x2="345" y2="572"></line><line class="cp-grid" x1="583" y1="28" x2="583" y2="572"></line><line class="cp-grid" x1="702" y1="28" x2="702" y2="572"></line><line class="cp-ref" x1="464" y1="28" x2="464" y2="572"></line><text class="cp-ref-label" x="464" y="21" text-anchor="middle">Christiano point (50%)</text><text class="cp-tick" x="226" y="589" text-anchor="middle">0%</text><text class="cp-tick" x="345" y="589" text-anchor="middle">25%</text><text class="cp-tick" x="464" y="589" text-anchor="middle">50%</text><text class="cp-tick" x="583" y="589" text-anchor="middle">75%</text><text class="cp-tick" x="702" y="589" text-anchor="middle">100%</text><text class="cp-axis-title" x="464" y="611" text-anchor="middle">AI share of the domain’s output</text><g class="cp-row" tabindex="0" role="img" data-i="0" aria-label="Lean formalisation. Uplift share 85% (range 65–97%). Volume share 95% (AI share of new Lean)."><rect class="cp-hit" x="0" y="35" width="720" height="36" rx="3"></rect><text class="cp-label" x="4" y="60.5">Lean formalisation</text><line class="cp-whisker" x1="535.4" y1="56" x2="687.7" y2="56"></line><path class="cp-vol" d="M678.2 49.5L684.7 56L678.2 62.5L671.7 56Z"></path><circle class="cp-dot" cx="630.6" cy="56" r="5"></circle><text class="cp-note" x="684.2" y="45" text-anchor="end">AI share of new Lean</text></g><g class="cp-row" tabindex="0" role="img" data-i="1" aria-label="De novo protein design. Uplift share 70% (range 35–90%). Volume share 95% (DL-generated designs)."><rect class="cp-hit" x="0" y="73" width="720" height="36" rx="3"></rect><text class="cp-label" x="4" y="98.5 index="0" role="img" data-i="13" aria-label="World economy. Uplift share 2% (range 1–4%). Volume share not measured."><rect class="cp-hit" x="0" y="529" width="720" height="36" rx="3"></rect><text class="cp-label" x="4" y="554.5">World economy</text><line class="cp-whisker" x1="230.8" y1="550" x2="245" y2="550"></line><circle class="cp-dot" cx="235.5" cy="550" r="5"></circle></g></svg></div>

<script>
var CP_ROWS = [["Lean formalisation",85,65,97,95,"AI share of new Lean"],["De novo protein design",70,35,90,95,"DL-generated designs"],["Erdős-type problems",65,45,85,45,"AI-primary new solutions"],["Software eng., frontier labs",60,33,75,85,"merged code"],["Software eng., industry",30,10,50,50,"new code"],["Frontier algorithmic progress",28,13,45,76,"research labour-time"],["Mathematics, overall",25,10,50,3,"papers / theorems"],["Frontier AI dev., overall",18,9,30,null,""],["Theoretical physics",17,5,38,null,""],["Biology, overall",13,5,29,null,""],["Experimental physics",9,2,23,null,""],["Materials science",9,0,23,null,""],["Drug discovery",5,0,15,1.5,"clinical-stage assets"],["World economy",2,1,4,null,""]];
function cpEsc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function cpPct(v) { return (Math.round(v * 10) / 10) + "%"; }
function cpDesc(r) {
  var s = r[0] + ". Uplift share " + r[1] + "% (range " + r[2] + "–" + r[3] + "%).";
  s += r[4] == null ? " Volume share not measured." : " Volume share " + cpPct(r[4]) + " (" + r[5] + ").";
  return s;
}
function cpRender(ROWS, W) {
  var narrow = W < 540;
  var padR = 18;
  var x0 = narrow ? 14 : 226;
  var x1 = W - padR;
  function X(v) { return x0 + (x1 - x0) * v / 100; }
  function f(n) { return Math.round(n * 10) / 10; }
  var top = 34, y = top, rows = [], i;
  for (i = 0; i < ROWS.length; i++) {
    var hasVol = ROWS[i][4] != null;
    var h = narrow ? (hasVol ? 58 : 44) : 38;
    var markY = narrow ? y + 32 : y + 22;
    rows.push({ r: ROWS[i], y: y, h: h, markY: markY });
    y += h;
  }
  var bottom = y + 6;
  var H = bottom + 48;
  var o = [];
  o.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="group" aria-label="Dot-and-whisker chart: AI share of each domain’s output, uplift estimate with range and measured volume share. Use Tab to step through the domains.">');
  // Vertical rules. In the stacked (narrow) layout each row's label sits on its own line above
  // the marks, so the rules are drawn per row, under the marks only, and never cross a label.
  var spans = narrow
    ? rows.map(function (row, k) { return [k === 0 ? top - 6 : row.y + 22, k === rows.length - 1 ? bottom : row.y + row.h]; })
    : [[top - 6, bottom]];
  function vline(cls, v) {
    spans.forEach(function (sp) {
      o.push('<line class="' + cls + '" x1="' + f(X(v)) + '" y1="' + f(sp[0]) + '" x2="' + f(X(v)) + '" y2="' + f(sp[1]) + '"></line>');
    });
  }
  [0, 25, 75, 100].forEach(function (v) { vline("cp-grid", v); });
  vline("cp-ref", 50);
  o.push('<text class="cp-ref-label" x="' + f(X(50)) + '" y="' + (top - 13) + '" text-anchor="middle">Christiano point (50%)</text>');
  [0, 25, 50, 75, 100].forEach(function (v) {
    o.push('<text class="cp-tick" x="' + f(X(v)) + '" y="' + (bottom + 17) + '" text-anchor="middle">' + v + '%</text>');
  });
  o.push('<text class="cp-axis-title" x="' + f((x0 + x1) / 2) + '" y="' + (bottom + 39) + '" text-anchor="middle">AI share of the domain’s output</text>');
  rows.forEach(function (row, k) {
    var r = row.r, my = row.markY;
    o.push('<g class="cp-row" tabindex="0" role="img" data-i="' + k + '" aria-label="' + cpEsc(cpDesc(r)) + '">');
    o.push('<rect class="cp-hit" x="0" y="' + f(row.y + 1) + '" width="' + W + '" height="' + (row.h - 2) + '" rx="3"></rect>');
    if (narrow) o.push('<text class="cp-label" x="' + x0 + '" y="' + (row.y + 17) + '">' + cpEsc(r[0]) + '</text>');
    else o.push('<text class="cp-label" x="4" y="' + (my + 4.5) + '">' + cpEsc(r[0]) + '</text>');
    o.push('<line class="cp-whisker" x1="' + f(X(r[2])) + '" y1="' + my + '" x2="' + f(X(r[3])) + '" y2="' + my + '"></line>');
    if (r[4] != null) {
      var vx = X(r[4]), d = 6.5;
      o.push('<path class="cp-vol" d="M' + f(vx) + ' ' + (my - d) + 'L' + f(vx + d) + ' ' + my + 'L' + f(vx) + ' ' + (my + d) + 'L' + f(vx - d) + ' ' + my + 'Z"></path>');
    }
    o.push('<circle class="cp-dot" cx="' + f(X(r[1])) + '" cy="' + my + '" r="5"></circle>');
    if (r[4] != null && r[5]) {
      var anchor = "middle", tx = vx;
      if (r[4] > 80) { anchor = "end"; tx = vx + 6; }
      else if (r[4] < 8) { anchor = "start"; tx = vx - 6; }
      if (Math.abs(r[4] - 50) < 3) { anchor = "start"; tx = vx + 5; }
      var tw = r[5].length * 6.0;
      var left = anchor === "start" ? tx : anchor === "end" ? tx - tw : tx - tw / 2;
      var ref = X(50);
      if (left < ref + 4 && left + tw > ref - 4) {
        // the note would run through the reference line: hang it on the side of the diamond away from it
        if (vx <= ref) { anchor = "end"; tx = Math.min(vx + 6, ref - 6); }
        else { anchor = "start"; tx = Math.max(vx - 6, ref + 6); }
        left = anchor === "start" ? tx : tx - tw;
      }
      if (left < x0 - 6) tx += (x0 - 6 - left);
      if (left + tw > W - 4) tx -= (left + tw - (W - 4));
      var ty = narrow ? my + 19 : my - 11;
      o.push('<text class="cp-note" x="' + f(tx) + '" y="' + ty + '" text-anchor="' + anchor + '">' + cpEsc(r[5]) + '</text>');
    }
    o.push('</g>');
  });
  o.push('</svg>');
  return o.join("");
}
(function () {
  var root = document.getElementById("cp-chart");
  if (!root) return;
  var plot = root.querySelector(".chart-plot");
  var tip = root.querySelector(".chart-tip");
  var lastW = 0, active = null;
  function draw() {
    var W = Math.floor(plot.clientWidth);
    if (!W || W === lastW) return;
    lastW = W;
    // a redraw replaces the rows, so carry keyboard focus (and its tooltip) over to the new ones
    var a = document.activeElement;
    var fi = (a && a.classList && a.classList.contains("cp-row") && plot.contains(a)) ? a.getAttribute("data-i") : null;
    plot.innerHTML = cpRender(CP_ROWS, W);
    active = null;
    if (fi !== null) {
      var g = plot.querySelector('.cp-row[data-i="' + fi + '"]');
      if (g) { g.focus(); show(g); }
    } else hide();
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function line(key, val, lab) {
    var d = el("div", "tip-row");
    var k = el("span", "tip-key " + key);
    d.appendChild(k);
    d.appendChild(el("span", "tip-val", val));
    d.appendChild(el("span", "tip-lab", lab));
    return d;
  }
  function show(g) {
    if (active && active !== g) active.classList.remove("is-active");
    active = g;
    g.classList.add("is-active");
    var r = CP_ROWS[+g.getAttribute("data-i")];
    tip.textContent = "";
    tip.appendChild(el("div", "tip-title", r[0]));
    tip.appendChild(line("u", r[1] + "%", "uplift share, range " + r[2] + "–" + r[3] + "%"));
    if (r[4] != null) tip.appendChild(line("v", cpPct(r[4]), "volume share: " + r[5]));
    else tip.appendChild(line("none", "–", "volume share not measured"));
    tip.hidden = false;
    var cr = root.getBoundingClientRect();
    var dot = g.querySelector(".cp-dot").getBoundingClientRect();
    var band = g.querySelector(".cp-hit").getBoundingClientRect();
    var cx = dot.left + dot.width / 2 - cr.left;
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var x = Math.max(0, Math.min(cx - tw / 2, root.clientWidth - tw));
    // sit above the whole row band (label and notes included), or below it at the top edge
    var y = band.top - cr.top - th - 4;
    if (y < 0) y = band.bottom - cr.top + 4;
    tip.style.left = Math.round(x) + "px";
    tip.style.top = Math.round(y) + "px";
  }
  function hide() {
    tip.hidden = true;
    if (active) { active.classList.remove("is-active"); active = null; }
  }
  draw();
  if ("ResizeObserver" in window) {
    var pending = false;
    new ResizeObserver(function () {
      if (pending) return;
      pending = true;
      requestAnimationFrame(function () { pending = false; draw(); });
    }).observe(plot);
  }
  plot.addEventListener("pointerover", function (e) {
    var g = e.target.closest && e.target.closest(".cp-row");
    if (g) show(g);
  });
  plot.addEventListener("pointerleave", function () {
    var f = document.activeElement;
    if (f && f.classList && f.classList.contains("cp-row") && plot.contains(f)) show(f); else hide();
  });
  plot.addEventListener("focusin", function (e) {
    var g = e.target.closest && e.target.closest(".cp-row");
    if (g) show(g);
  });
  plot.addEventListener("focusout", function (e) {
    var n = e.relatedTarget;
    if (!n || !plot.contains(n)) hide();
  });
  plot.addEventListener("keydown", function (e) { if (e.key === "Escape") hide(); });
})();
</script>
